name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ['1.22', '1.23']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      
      - name: Build
        run: go build -v ./...
      
      - name: Test
        run: go test -v -short ./...
  
  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## go-digikey ${{ github.ref_name }}

            ### Features
            - Service-based architecture (`client.Search`, `client.Product`, `client.Category`, `client.Pricing`)
            - All 11 DigiKey Product Search API v4 endpoints
            - OAuth2 client credentials authentication
            - Built-in caching with configurable TTL
            - Automatic retries with exponential backoff
            - Rate limiting (120/min, 1000/day)
            - Locale support (US, DE, JP, etc.)

            ### Usage
            ```go
            client := digikey.NewClient(clientID, clientSecret)
            defer client.Close()

            results, err := client.Search.KeywordSearch(ctx, &digikey.SearchRequest{
              Keywords: "LED",
              Limit: 10,
            })
            ```

            See README.md for full documentation.
          draft: false
          prerelease: false
